services:
  - type: web
    name: sevamitra-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PROJECT_NAME
        value: SevaMitra Multilingual Government Service Assistant
      - key: ALLOWED_ORIGINS
        value: "*"
